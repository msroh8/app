                learner: 'تحديد أوجه الشبه والاختلاف بأنفسهم، أو وفقًا لتوجيه المعلم، وصياغة التعليمات في ضوء نتائج المقارنة.<br><br>تنظيم العناصر وتصنيفها في مجموعات، باستخدام معايير مناسبة بناءً على أوجه الشبه والاختلاف المكتشفة.<br><br>تحليل المعلومات واستخلاص الفروق والتشابهات بين العناصر أو المفاهيم المدروسة، مما يعزز فهمهم العميق للمفهوم (مثل أقسام العناصر أو العناصر الكيميائية، أو الموضوعات الدراسية الأخرى).<br><br>التطبيق العملي من خلال القيام بتدريبات متنوعة تدعم فهمهم، وقد تشمل هذه التدريبات إعداد مخططات، جداول مقارنة، أو رسومات توضيحية تعكس فهمهم للتشابهات والاختلافات'

                teacher: 'ستحتاج إلى تقديم مشكلات واقعية تناسب الطلاب لمناقشتها معهم، وترك الطلاب يعملون متعاونين لحلها (اقتراح حلول مناسبة من الطلاب بعد فرض الفروض) ، وشجع على تطبيق التقويم الذاتي وتقويم الأقران',
                learner: 'سيكون دور الطلاب جمع المعلومات حول المشكلة واتباع المنهج العلمي لحل المشكلة (تحديد المشكلة، تحليل المشكلة، استخدام ما تم جمعه من المعلومات، فرض الفروض، التأكد من صحة الفروض، اختيار الحل المناسب) والتعاون معاً لحلها'

                teacher: 'استثارة دافعية الطلاب للتعلم ومراعاة أنماط التعلم المختلفة عند التدريب على حل المسائل.<br><br>التحقق من إتقان الطلاب لحل المسائل <br><br>تكليف الطالب بتدريبات ومهام أدائية من مصادر المعلم للأنشطة الصفية (كما في تنويع التعليم) تعطي الفرصة للطالب لممارسة الحل',
                learner: 'حل المسائل عن طريق عمليات الاستدلال والاسترجاع التلقائي للحقائق <br><br>التدريب والممارسة حتى يكتسب مهارتي السرعة في الإنجاز والقدرة على التعامل مع حل المسائل بأشكال وصور مختلفة'

            {
                id: 's12',
                title: 'المنظمات المتقدمة',

                learner: 'تفسير العلاقات التي تربط المفاهيم فيما بينها، وطبيعة العلاقة، وربط المعلومات ليكون التعلم ذو معنى لتنمية قدرة الاستدلال والاستقراء وإدراك العلاقات وربط المعلومات  بحيث يستطيع المتعلم إيجاد العلاقة بين هذه المفردات'
            }

        const cardsContainer = document.getElementById('cardsContainer');
        const viewedItems = new Set();
        
        // Modal Elements
        const modal = document.getElementById('strategyModal');
        const modalPanel = document.getElementById('modalPanel');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalBackdrop = document.getElementById('modalBackdrop');
        
        function init() {
            renderCards();
            updateProgress();
            
            // Event Listeners for closing modal
            closeModalBtn.addEventListener('click', closeModal);
            modalBackdrop.addEventListener('click', closeModal);
            document.addEventListener('keydown', (e) => {
                if(e.key === 'Escape' && !modal.classList.contains('hidden')) {
                    closeModal();
                }
            });
        }

        function renderCards() {
            strategiesData.forEach((strategy, index) => {
                const card = document.createElement('div');
                // Staggered animation delay
                card.style.animationDelay = `${index * 0.05}s`;
                card.className = `strategy-card opacity-0 animate-fade-in bg-white border border-gray-200 rounded-2xl p-5 cursor-pointer flex flex-col items-center justify-center text-center group relative overflow-hidden`;
                card.id = `card-${strategy.id}`;
                card.onclick = () => openModal(strategy);
                
                card.innerHTML = `
                    <!-- Background decorative shape -->
                    <div class="absolute -right-8 -top-8 w-24 h-24 bg-ain-bg rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500 z-0"></div>
                    
                    <!-- Checkmark Badge (Hidden initially) -->
                    <div id="check-${strategy.id}" class="absolute top-3 left-3 bg-green-500 text-white p-1 rounded-full opacity-0 transform scale-0 transition-all duration-300 z-10 shadow-sm">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>

                    <div class="relative z-10 text-ain-cyan group-hover:text-ain-purpleLight transition-colors duration-300 mb-4 bg-gray-50 p-4 rounded-full">
                        <svg class="svg-icon-small" viewBox="0 0 24 24">
                            ${strategy.svg}
                        </svg>
                    </div>
                    
                    <h3 class="relative z-10 text-lg font-bold text-gray-800 group-hover:text-ain-purpleDark transition-colors">${strategy.title}</h3>
                `;
                cardsContainer.appendChild(card);
            });
        }

        function openModal(strategy) {
            // Populate Data
            document.getElementById('modalTitle').innerText = strategy.title;
            document.getElementById('modalDesc').innerHTML = strategy.desc;
            document.getElementById('modalTeacher').innerHTML = strategy.teacher;
            document.getElementById('modalLearner').innerHTML = strategy.learner;
            document.getElementById('modalIconContainer').innerHTML = `<svg class="svg-icon-large" viewBox="0 0 24 24">${strategy.svg}</svg>`;
            
            // Mark as viewed
            markAsViewed(strategy.id);

            // Show Modal with animation
            modal.classList.remove('hidden');
            // Small delay to allow display:block to apply before animating opacity/transform
            setTimeout(() => {
                modalPanel.classList.remove('opacity-0', 'scale-95');
                modalPanel.classList.add('opacity-100', 'scale-100');
            }, 10);
        }

        function closeModal() {
            // Hide with animation
            modalPanel.classList.remove('opacity-100', 'scale-100');
            modalPanel.classList.add('opacity-0', 'scale-95');
            
            // Wait for transition to finish before hiding container
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function markAsViewed(id) {
            if (!viewedItems.has(id)) {
                viewedItems.add(id);
                
                // Animate checkmark on card
                const check = document.getElementById(`check-${id}`);
                const card = document.getElementById(`card-${id}`);
                if(check && card) {
                    check.classList.remove('opacity-0', 'scale-0');
                    check.classList.add('opacity-100', 'scale-100');
                    card.classList.add('border-green-300', 'bg-green-50/30');
                }
                
                updateProgress();
            }

            // Show badge in modal
            const badge = document.getElementById('modalStatusBadge');
            badge.classList.remove('hidden');
        }

        function updateProgress() {
            const total = strategiesData.length; // 12
            const viewed = viewedItems.size;
            const percentage = (viewed / total) * 100;
            
            document.getElementById('progress-text').innerText = `${viewed} / ${total}`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
